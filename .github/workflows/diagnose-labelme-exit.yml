---
name: Diagnose published Labelme exit
on:
  workflow_dispatch:
  push:
    branches: [codex/labelme-7.9.1-exit]
    paths:
      - .github/workflows/diagnose-labelme-exit.yml
      - buildkit/verify_windows_exit.py
permissions:
  contents: read
concurrency:
  group: diagnose-labelme-exit
  cancel-in-progress: true
jobs:
  published-exe:
    runs-on: windows-2022
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Install native process probe
        run: python -m pip install psutil==7.2.2 PySide6-Essentials==6.11.1 shiboken6==6.11.1
      - name: Download the reported release
        run: gh release download v7.9.1-layout.2 --pattern '*.exe' --dir baseline
      - name: Observe native close and process cleanup
        shell: pwsh
        run: |
          python buildkit/verify_windows_exit.py --exe baseline/Labelme-7.9.1-layout.2-Windows-x64.exe --report diagnostics/default.json --image tests/data/raw/2011_000003.jpg --observe-only
          python buildkit/verify_windows_exit.py --exe baseline/Labelme-7.9.1-layout.2-Windows-x64.exe --report diagnostics/floating.json --image tests/data/raw/2011_000003.jpg --floating --observe-only
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: Labelme-exit-baseline
          path: diagnostics/*.json
          if-no-files-found: error
